[build]
  command   = "npm run build"
  publish   = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Force HTTPS — www + http → https apex
[[redirects]]
  from   = "http://getvidya.in/*"
  to     = "https://getvidya.in/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "http://www.getvidya.in/*"
  to     = "https://getvidya.in/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "https://www.getvidya.in/*"
  to     = "https://getvidya.in/:splat"
  status = 301
  force  = true

[dev]
  command = "npm run dev"
  port    = 3000
