[build]
  command   = "npm run build"
  publish   = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect /admin login protection (belt-and-suspenders with middleware)
[[redirects]]
  from   = "/admin"
  to     = "/admin"
  status = 200

# Force HTTPS
[[redirects]]
  from   = "http://getvidya.in/*"
  to     = "https://getvidya.in/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "http://www.getvidya.in/*"
  to     = "https://getvidya.in/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "https://www.getvidya.in/*"
  to     = "https://getvidya.in/:splat"
  status = 301
  force  = true

# SPA fallback for dynamic routes
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  port    = 3000
